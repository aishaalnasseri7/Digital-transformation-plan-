document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

edia print {\n    body { background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }\n    [data-noprint] { display:none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div dir=\"rtl\" style=\"min-height:100vh;padding:0 0 64px\">\n\n  <div style=\"background:#063539;background-image:linear-gradient(115deg,#04292c 0%,#063539 42%,#0a5f63 100%);color:#fff\">\n    <div style=\"max-width:1640px;margin:0 auto;padding:18px 40px 14px;display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap\">\n      <img src=\"0d6572d9-d29d-4431-a695-79d36e425697\" alt=\"صندوق الحماية الاجتماعية — Social Protection Fund\" style=\"height:50px;width:auto;display:block\">\n      <div style=\"display:flex;align-items:center;gap:26px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:3px;text-align:left\">\n          <span style=\"font-size:11.5px;letter-spacing:.04em;color:#8fbdba\">آخر تحديث<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:500\">31 أغسطس 2026<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"width:1px;height:32px;background:#1f5f61\"><\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:3px;text-align:left\">\n          <span style=\"font-size:11.5px;letter-spacing:.04em;color:#8fbdba\">الإصدار<\u002Fspan>\n          <span style=\"font-size:14.5px;font-weight:500\">الثالث · متابعة رقم 3<\u002Fspan>\n        <\u002Fdiv>\n        <div data-noprint=\"\" style=\"display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ exportCsv }}\" style=\"background:#b48b3c;border:1px solid #c69f52;border-radius:9px;color:#231703;font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;cursor:pointer;transition:background .15s\" style-hover=\"background:#c69f52\">تصدير Excel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ doPrint }}\" style=\"background:rgba(255,255,255,.08);border:1px solid #2c7b7e;border-radius:9px;color:#d9ecea;font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;cursor:pointer;transition:background .15s\" style-hover=\"background:rgba(255,255,255,.16)\">طباعة / PDF<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ toggleFs }}\" style=\"background:rgba(255,255,255,.08);border:1px solid #2c7b7e;border-radius:9px;color:#d9ecea;font-family:inherit;font-size:13px;font-weight:500;padding:9px 15px;cursor:pointer;transition:background .15s\" style-hover=\"background:rgba(255,255,255,.16)\">عرض كامل<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:linear-gradient(90deg,transparent,#b48b3c 22%,#b48b3c 78%,transparent);opacity:.55\"><\u002Fdiv>\n    <div style=\"max-width:1640px;margin:0 auto;padding:18px 40px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:7px\">\n        <h1 style=\"margin:0;font-size:33px;font-weight:700;letter-spacing:-.01em;line-height:1.2\">خطة التحول الرقمي 2026<\u002Fh1>\n        <div style=\"font-size:15.5px;color:#9cc9c7;font-weight:500\">لوحة متابعة الموقف التنفيذي — الربع الثالث<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;padding:10px 16px;border:1px solid #1f5f61;border-radius:12px;background:rgba(255,255,255,.05)\">\n        <span style=\"font-size:11.5px;color:#8fbdba;line-height:1.6;max-width:190px\">برنامج التحول الرقمي<\u002Fspan>\n        <span style=\"width:1px;height:30px;background:#1f5f61\"><\u002Fspan>\n        <img src=\"c2d12391-225e-49be-84e2-907878570946\" alt=\"تحول — tahawul\" style=\"height:30px;width:auto;display:block\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1640px;margin:0 auto;padding:0 40px\">\n\n    <div data-noprint=\"\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #e4eae9;border-radius:12px;padding:12px 16px;margin-top:20px;box-shadow:0 1px 2px rgba(6,53,57,.04),0 10px 24px -16px rgba(6,53,57,.14)\">\n      <span style=\"font-size:12px;font-weight:600;color:#6b7686;letter-spacing:.03em\">فلاتر عامة<\u002Fspan>\n      <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"بحث في المشروعات والمبادرات…\" style=\"font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid #dde4e3;border-radius:8px;width:280px;outline:none;background:#fafcfb\">\n      <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <button sc-camel-on-click=\"{{ c.on }}\" style=\"{{ c.style }}\" style-hover=\"filter:brightness(.97)\">{{ c.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <sc-raw-select value=\"{{ sev }}\" sc-camel-on-change=\"{{ onSev }}\" style=\"font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #dde4e3;border-radius:8px;background:#fafcfb\">\n        <option value=\"all\">كل مستويات الانحراف عن مسار<\u002Foption>\n        <option value=\"crit\">انحراف ‎-20 نقطة أو أكثر<\u002Foption>\n        <option value=\"mid\">انحراف من ‎-10 إلى ‎-19<\u002Foption>\n        <option value=\"low\">انحراف من ‎-1 إلى ‎-9<\u002Foption>\n        <option value=\"ok\">مساوٍ أو أعلى من المستهدف<\u002Foption>\n      <\u002Fsc-raw-select>\n      <sc-raw-select value=\"{{ attn }}\" sc-camel-on-change=\"{{ onAttn }}\" style=\"font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #dde4e3;border-radius:8px;background:#fafcfb\">\n        <option value=\"all\">كل مستويات اهتمام الإدارة<\u002Foption>\n        <option value=\"1\">يتطلب اهتمام الإدارة<\u002Foption>\n        <option value=\"2\">قرار إداري مطلوب<\u002Foption>\n        <option value=\"3\">تجاوز تاريخ الانتهاء<\u002Foption>\n      <\u002Fsc-raw-select>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b7686\">{{ shownCount }} / 11<\u002Fspan>\n      <button sc-camel-on- o',monospace;\" : ''}${(o && o.center) ? 'text-align:center;' : ''}${(o && o.color) ? 'color:' + o.color + ';font-weight:600;' : ''}${(o && o.muted) ? 'color:#6b7686;font-size:12px;' : ''}` });\n      const map = {\n        name: cell(p.name, { muted: true }), sub: cell(p.sub), out: cell(p.out, { muted: true }),\n        pm: cell(p.pm), start: cell(p.start, { mono: true }), end: cell(p.end, { mono: true, color: [3, 4, 9].includes(p.n) ? C.red : null }),\n        budget: cell(this.fmt(p.budget), { mono: true }), reserved: cell(this.fmt(p.reserved), { mono: true, color: p.reserved ? null : C.red }),\n        q1: cell(p.q[0], { mono: true, center: true }), q2: cell(p.q[1], { mono: true, center: true }), q3: cell(p.q[2], { mono: true, center: true }), q4: cell(p.q[3], { mono: true, center: true }),\n        actual: cell(p.actual + '%', { mono: true, center: true }), dev: cell(this.devTxt(d), { mono: true, center: true, color: this.devColor(d) }),\n        status: { v: s.label, style: `padding:11px 10px;border-bottom:1px solid #eff3f2;text-align:center;font-size:11.5px;font-weight:600;color:${s.c}` }\n      };\n      return { cells: cols.map(c => map[c.k]), style: `cursor:pointer;border-inline-start:4px solid ${s.c}`, open: this.open(p) };\n    });\n\n    const colToggles = [\n      { k: 'q', label: 'الأرباع Q1–Q4' }, { k: 'fin', label: 'الموازنة والمحجوز' }, { k: 'meta', label: 'المخرج النهائي' }, { k: 'pm', label: 'مدير المشروع' }\n    ].map(t => ({\n      label: t.label,\n      style: `font-family:inherit;font-size:12px;padding:6px 11px;border-radius:20px;cursor:pointer;border:1px solid ${st.cols[t.k] ? '#0a5f63' : '#dde4e3'};background:${st.cols[t.k] ? '#e8f2f1' : '#fff'};color:${st.cols[t.k] ? '#0a5f63' : '#6b7686'};font-weight:500`,\n      on: () => this.setState(s => ({ cols: { ...s.cols, [t.k]: !s.cols[t.k] } }))\n    }));\n\n    // gantt\n    const months = ['ينا', 'فبر', 'مار', 'أبر', 'ماي', 'يون', 'يول', 'أغس', 'سبت', 'أكت', 'نوف', 'ديس'];\n    const pct = d => d / 365 * 100;\n    const gantt = sorted.map(p => {\n      const s = this.ST[p.st], d = p.actual - p.target, overdue = [3, 4, 9].includes(p.n);\n      const left = pct(p.s), w = Math.max(pct(p.e - p.s), 2);\n      return {\n        sub: p.sub, dotStyle: this.dot(s.c, 9), open: this.open(p),\n        tip: `${p.sub} — ${p.name} | البداية ${p.start} | النهاية ${p.end}${p.expLabel ? ' | المتوقع ' + p.expLabel : ''} | المستهدف ${p.target}% | الفعلي ${p.actual}% | الانحراف عن مسار ${d} | ${s.label}`,\n        barStyle: `position:absolute;top:6px;height:14px;inset-inline-start:${left}%;width:${w}%;background:${s.c}22;border:1px solid ${s.c}55;border-radius:4px`,\n        fillStyle: `position:absolute;top:6px;height:14px;inset-inline-start:${left}%;width:${w * p.actual / 100}%;background:${s.c};border-radius:4px`,\n        expStyle: p.expEnd ? `position:absolute;top:6px;height:14px;inset-inline-start:${pct(p.e)}%;width:${pct(p.expEnd - p.e)}%;background:repeating-linear-gradient(45deg,${C.red}55 0 4px,transparent 4px 8px);border:1px dashed ${C.red};border-radius:4px` : 'display:none',\n        labelStyle: `position:absolute;top:7px;inset-inline-start:calc(${left + w}% + 8px);font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:${overdue ? C.red : '#8a929f'};white-space:nowrap`,\n        label: p.actual + '%' + (overdue ? ' · تجاوز التاريخ' : '') + (p.startsEarlier ? ' · بدأ قبل 2026' : '')\n      };\n    });\n\n    // health matrix\n    const healthHeaders = ['المشروع / المبادرة', 'الجدول الزمني', 'الإنجاز', 'الموازنة', 'الحالة الفنية', 'المشتريات', 'الحالة العامة']\n      .map((h, i) => ({ label: h, style: `text-align:${i === 0 ? 'start' : 'center'};padding:10px;font-size:11.5px;font-weight:600;color:#5d6675;background:#eef5f4;border-bottom:1px solid #d8e6e4;white-space:nowrap` }));\n    const health = sorted.map(p => {\n      const s = this.ST[p.st];\n      return { sub: p.sub, dots: p.rag.map(k => ({ style: this.dot(this.ragColor(k), 12) })), statusLabel: s.label, badgeStyle: this.badge(s.c), open: this.open(p) };\n    });\n\n    // finance\n    const finCards = [\n      { label: 'إجمالي الموازنة المعتمدة', val: this.fmt(totalBudget), c: '#171c24' },\n      { label: 'إجمالي المبالغ المحجوزة', val: this.fmt(totalReserved), c: '#171c24' },\n      { label: 'غير المحجوز', val: this.fmt(totalBudget - totalReserved), c: C.orange },\n      { label: 'نسبة الحجز', val: reservePct, c: totalReserved ? '#171c24' : C.red },\n    ].map(f => ({ label: f.label, val: f.val, valStyle: `font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;color:${f.c}` }));\n\n    const verifyItems = ['إجراءات المشتريات لا تزال مستمرة', 'الحجز يتم عند الإسناد فقط', 'الموازنة لم تُخصَّص بعد', 'البيانات المالية لم يتم تحديثها'].map((label, i) => ({\n      label, mark: st.verify[i] ? '☑' : '☐',\n      style: `display:flex;align-items:center;gap:8px;font-family:inherit;font-size:12.5px;text-align:start;background:${st.verify[i] ? '#fff' : 'transparent'};border:1px solid ${st.verify[i] ? '#e0cdb8' : 'transparent'};border-radius:7px;padding:6px 8px;cursor:pointer;color:#3b4552;width:100%`,\n      on: () => this.setState(s => ({ verify: { ...s.verify, [i]: !s.verify[i] } }))\n    }));\n\n    const maxB = Math.max(...rows.map(p => p.budget), 1);\n    const budgetBars = [...rows].sort((a, b) => b.budget - a.budget).map(p => ({\n      sub: p.sub, budgetF: this.fmt(p.budget),\n      barStyle: `position:absolute;inset-block:0;inset-inline-start:0;width:${Math.max(p.budget / maxB * 100, 1.5)}%;background:${this.ST[p.st].c}cc;border-radius:4px`\n    }));\n\n    // priority matrix\n    const matrix = rows.map(p => {\n      const s = this.ST[p.st];\n      return {\n        n: p.n, open: this.open(p),\n        tip: `${p.sub} — ${s.label} | الانحراف عن مسار ${p.actual - p.target} نقطة | الموازنة ${this.fmt(p.budget)}`,\n        style: `position:absolute;inset-inline-start:${p.u}%;bottom:${p.im}%;transform:translate(50%,50%);width:28px;height:28px;border-radius:50%;background:${s.c};color:#fff;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(6,53,57,.2);transition:transform .15s`\n      };\n    });\n\n    // insights\n    const worst = [...rows].sort((a, b) => (a.actual - a.target) - (b.actual - b.target))[0];\n    const overdueList = rows.filter(p => [3, 4, 9].includes(p.n));\n    const procurement = rows.filter(p => [1, 7, 10, 11].includes(p.n));\n    const technical = rows.filter(p => [3, 4, 9].includes(p.n));\n    const attnBudget = sum(rows.filter(p => p.st !== 'on'), p => p.budget);\n    const ins = [\n      { val: this.iso(below.length + '/' + rows.length), c: C.red, text: 'مشروعات أقل من مستهدف Q3، بمتوسط انحراف ' + this.devTxt(avgDev) + ' نقطة مئوية.' },\n      { val: worst ? this.devTxt(worst.actual - worst.target) : 0, c: C.red, text: worst ? 'أكبر انحراف سلبي: «' + worst.sub + '» بإنجاز ' + worst.actual + '% مقابل مستهدف ' + worst.target + '%.' : '—' },\n      { val: overdueList.length, c: C.red, text: 'مشروعات تجاوزت تاريخ الانتهاء المخطط دون اكتمال التنفيذ: ' + (overdueList.map(p => p.sub).join('، ') || '—') + '.' },\n      { val: rows.filter(p => [5, 7, 10].includes(p.n)).length, c: C.orange, text: 'مشروعات تحتاج إلى قرار إداري: إعادة طرح مناقصة نظام التخطيط الآلي، إقفال التفاوض قبل الإسناد لدراسة النضج، والاستمرار أو الإيقاف في التكامل مع المنصة الحكومية الموحدة.' },\n      { val: procurement.length, c: C.orange, text: 'مشروعات موقفها التنفيذي مرتبط بإجراءات المشتريات والمناقصات.' },\n      { val: technical.length, c: C.orange, text: 'مشروعات تواجه مشكلات فنية: التراخيص، كفاءة التهوية بالموقع، وتغيير التقنية المستخدمة.' },\n      { val: rows.filter(p => p.st === 'deferred').length, c: C.grey, text: 'مشروع مؤجل إلى 2028 بقرار إداري بعد إنجاز 75% واكتمال تحليل الأعمال.' },\n      { val: this.fmt(attnBudget), c: C.navy, text: 'قيمة الموازنات المرتبطة بالمشروعات التي تحتاج إلى متابعة، من إجمالي ' + this.fmt(totalBudget) + '.' },\n      { val: this.fmt(totalReserved), c: C.navy, text: 'إجمالي المبالغ المحجوزة، وهي مسجّلة لثلاثة مشروعات فقط: البنية الأساسية الرقمية، ودراسة النضج، ونظام إصابات العمل.' }\n    ];\n    const insights = ins.map(i => ({ val: i.val, text: i.text, valStyle: `font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:${i.c};text-align:center` }));\n\n    // side panel\n    const p = this.P.find(x => x.n === st.sel);\n    let sel = null;\n    if (p) {\n      const s = this.ST[p.st], d = p.actual - p.target;\n      const overdue = [3, 4, 9].includes(p.n);\n      sel = {\n        sub: p.sub, name: p.name, desc: p.desc, out: p.out, exec: p.exec,\n        statusLabel: s.label, dotStyle: this.dot(s.c, 12), badgeStyle: this.badge(s.c),\n        stats: [\n          { label: 'الإنجاز الفعلي', val: p.actual + '%', c: '#171c24' },\n          { label: 'المستهدف Q3', val: p.target + '%', c: '#171c24' },\n          { label: 'الانحراف عن مسار', val: this.devTxt(d), c: this.devColor(d) },\n          { label: 'الحالة', val: s.label, c: s.c },\n          { label: 'مدير المشروع', val: p.pm, c: '#0d2f2e' },\n          { label: 'البداية', val: p.start, c: '#171c24' },\n          { label: 'النهاية المخططة', val: p.end, c: overdue ? C.red : '#171c24' },\n          { label: 'الانتهاء المتوقع', val: p.expDate || 'غير محدد في التقرير', c: '#171c24' },\n          { label: overdue ? 'أيام التأخير' : 'الأيام المتبقية', val: overdue ? String(242 - p.e) : String(p.e - 242), c: overdue ? C.red : '#171c24' },\n          { label: 'الموازنة', val: this.fmt(p.budget), c: '#171c24' },\n          { label: 'المبلغ المحجوز', val: this.fmt(p.reserved), c: p.reserved ? '#171c24' : C.red },\n          { label: 'غير المحجوز', val: this.fmt(p.budget - p.reserved), c: '#171c24' },\n          { label: 'نسبة الحجز', val: Math.round(p.reserved / p.budget * 100) + '%', c: p.reserved ? '#171c24' : C.red },\n        ].map(x => ({ label: x.label, val: x.val, valStyle: `font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:${x.c};line-height:1.4` })),\n        quarters: ['Q1', 'Q2', 'Q3', 'Q4'].map((l, i) => ({ label: l, val: p.q[i] })),\n        hasChain: !!p.attn,\n        chain: p.attn ? [\n          { k: 'ماذا حدث؟', v: p.attn.problem },\n          { k: 'لماذا حدث؟', v: p.attn.cause },\n          { k: 'ما الأثر؟', v: p.attn.impact },\n          { k: 'ماذا تم حتى الآن؟', v: p.attn.done.join(' · ') },\n          { k: 'ما الخطوة القادمة / القرار المطلوب؟', v: p.attn.next.join(' · ') },\n          { k: 'مدير المشروع وتاريخ المعالجة', v: 'مدير المشروع: ' + p.pm + ' — تاريخ المعالجة: ' + (p.expDate || 'غير محدد في التقرير') }\n        ] : [],\n        chainStyle: ''\n      };\n    }\n\n    return {\n      q: st.q, sev: st.sev, attn: st.attn, chips, colToggles, months,\n      onSearch: e => this.setState({ q: e.target.value }),\n      onSev: e => this.setState({ sev: e.target.value }),\n      onAttn: e => this.setState({ attn: e.target.value }),\n      resetFilters: () => this.setState({ status: null, q: '', sev: 'all', attn: 'all' }),\n      exportCsv: this.exportCsv, doPrint: this.doPrint, toggleFs: this.toggleFs,\n      shownCount: rows.length,\n      overallLabel, overallWhy: 'محتسبة من: التأخير الزمني، الفرق بين المستهدف والفعلي (' + avgActual + '% مقابل ' + avgTarget + '%)، المشروعات المتأخرة والمؤجلة، المشكلات الفنية، تحديات المناقصات، والقرارات المعلقة. الأداء الإجمالي للمشروعات ' + perf + '%.',\n      overallCardStyle: `background:${oc};color:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;box-shadow:0 2px 8px ${oc}40`,\n      overallDotStyle: `width:14px;height:14px;border-radius:50%;background:#fff;display:inline-block;flex:none`,\n      avgActual, avgTarget, avgDev: this.devTxt(avgDev), belowCount: below.length, criticalCount: critical,\n      kLate: counts('late'), kIn: rows.filter(p => p.st !== 'deferred').length, kWatch: counts('watch'),\n      totalBudget: this.fmt(totalBudget), totalReserved: this.fmt(totalReserved), reservePct,\n      miniKpis: [\n        { label: 'قيد الإجراء', val: rows.filter(x => x.st !== 'deferred').length, c: C.navy },\n        { label: 'يسير وفق الخطة', val: counts('on'), c: C.green },\n        { label: 'يحتاج إلى متابعة', val: counts('watch'), c: C.orange },\n        { label: 'متأخر', val: counts('late'), c: C.red },\n        { label: 'مؤجل', val: counts('deferred'), c: C.grey },\n        { label: 'نسبة الأداء الإجمالية للمشروعات', val: perf + '%', c: perf < 80 ? C.orange : C.green }\n      ].map(m => ({ label: m.label, val: m.val, valStyle: `font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:${m.c}` })),\n      attention, bars, donutStyle, donutLegend, headers, rows: tRows, gantt, healthHeaders, health,\n      finCards, verifyItems, budgetBars, matrix, insights,\n      sel, closePanel: () => this.setState({ sel: null }),\n      panelHeadStyle: 'padding:22px 24px 18px;border-bottom:1px solid #eaefee;background:#fafcfc;position:sticky;top:0;z-index:2'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
